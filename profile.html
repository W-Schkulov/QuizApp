<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/global.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="./JavaScript/index.js" defer></script>
    <title>Profile - Quiz App</title>
  </head>
  <body data-js="body">
    <header class="header">
      <h1 class="header__title">Quiz App</h1>
    </header>
    <main class="profile">
      <div class="profile__card">
        <img
          class="profile__card-img"
          src="https://source.unsplash.com/random/300x300?portrait"
          alt=""
          height="200"
          width="200"
        />
        <h2 class="profile-card__name">Max Doe</h2>
      </div>
      <h3>About me</h3>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Voluptatum
        dignissimos, reprehenderit quam facilis animi in distinctio nemo est
        culpa velit non unde expedita porro. Expedita animi quo voluptates
        blanditiis libero?
      </p>
      <ul class="counter-list">
        <li class="counter-list__item">
          <i class="fa-solid fa-question"></i>
          <span>12</span>
        </li>
        <li class="counter-list__item">
          <i class="fas fa-bookmark"></i>
          <span>4</span>
        </li>
      </ul>
      <h2 id="title">Settings</h2>
      <div class="profile__settings">
        <label class="switch">
          <input type="checkbox" data-js="switch-darkmode" />
          <span class="slider"></span>
        </label>
        <span>Dark Mode</span>
      </div>
    </main>
    <footer>
      <nav class="navigation">
        <ul class="navigation__list">
          <li class="list__item">
            <a href="index.html"><i class="fas fa-home fa-2x"></i></a>
          </li>
          <li class="list__item">
            <a href="bookmarks.html"><i class="fas fa-bookmark fa-2x"></i></a>
          </li>
          <li class="list__item" active>
            <a href="forms.html"><i class="fa-solid fa-plus fa-2x"></i></a>
          </li>
          <li class="list__item">
            <a href="profile.html"><i class="fas fa-user fa-2x"></i></a>
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
